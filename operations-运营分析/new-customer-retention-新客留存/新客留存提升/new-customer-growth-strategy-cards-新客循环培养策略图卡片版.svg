<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <style>
    .f { font-family: "STKaiti","华文楷体","Kaiti SC","KaiTi",serif; fill:#23305c; }
    .title { font-size: 34px; font-weight: 700; }
    .sub { font-size: 16px; font-weight: 700; fill:#3a4778; }
    .rule-title { font-size: 20px; font-weight: 700; }
    .rule-body { font-size: 14px; font-weight: 700; fill:#3a4778; }
    .section { font-size: 18px; font-weight: 700; }
    .tick { font-size: 14px; font-weight: 700; fill:#42508a; text-anchor: middle; }
    .stage-title { font-size: 18px; font-weight: 700; fill:#ffffff; text-anchor: middle; }
    .stage-sub { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .card-head { font-size: 20px; font-weight: 700; }
    .card-line { font-size: 16px; font-weight: 700; }
    .metric { font-size: 14px; font-weight: 700; }
  </style>

  <rect width="1600" height="980" fill="#f7f9ff"/>

  <rect x="34" y="34" width="10" height="54" rx="5" fill="#3949ab"/>
  <text x="64" y="76" class="f title">美国新客循环培养策略主链路（T+60）</text>
  <text x="64" y="118" class="f sub">目标：在首单后 T+60 内，把用户稳定承接到第 3 单，并通过 AB 实验验证效果</text>

  <line x1="40" y1="150" x2="1520" y2="150" stroke="#cfd6ef" stroke-width="3"/>

  <rect x="70" y="182" width="1410" height="92" rx="24" fill="#eef2ff" stroke="#b7c3f5" stroke-width="2"/>
  <text x="104" y="220" class="f rule-title">统一规则</text>
  <text x="104" y="258" class="f rule-body">每天检查 1 次 ｜ 首周最多提醒 2 次 ｜ 第二周起每周最多提醒 1 次 ｜ 遵循全局频控</text>

  <text x="70" y="332" class="f section">首单后滚动天数</text>
  <line x1="260" y1="364" x2="1430" y2="364" stroke="#b7c3f5" stroke-width="4"/>

  <g class="f">
    <circle cx="330" cy="364" r="11" fill="#f7f9ff" stroke="#5a6fe0" stroke-width="5"/>
    <text x="330" y="338" class="tick">T+3</text>
    <circle cx="510" cy="364" r="11" fill="#f7f9ff" stroke="#5a6fe0" stroke-width="5"/>
    <text x="510" y="338" class="tick">T+7</text>
    <circle cx="730" cy="364" r="11" fill="#f7f9ff" stroke="#5a6fe0" stroke-width="5"/>
    <text x="730" y="338" class="tick">T+14</text>
    <circle cx="1040" cy="364" r="11" fill="#f7f9ff" stroke="#5a6fe0" stroke-width="5"/>
    <text x="1040" y="338" class="tick">T+30</text>
    <circle cx="1350" cy="364" r="11" fill="#f7f9ff" stroke="#5a6fe0" stroke-width="5"/>
    <text x="1350" y="338" class="tick">T+60</text>
  </g>

  <rect x="70" y="414" width="140" height="200" rx="28" fill="#4c58c8"/>
  <text x="140" y="478" class="stage-title">1→2单</text>
  <text x="140" y="530" class="stage-sub" fill="#dfe4ff">承接二单</text>
  <text x="140" y="572" class="stage-sub" fill="#dfe4ff">券面：2.99 / 5折</text>

  <g class="f">
    <rect x="270" y="416" width="190" height="170" rx="26" fill="#ffffff" stroke="#cad2f4" stroke-width="2.5"/>
    <text x="300" y="458" class="card-head">T+3</text>
    <text x="300" y="502" class="card-line">首单后 1-3 天</text>
    <text x="300" y="542" class="card-line">未下 2 单</text>
    <text x="300" y="582" class="card-line">T+4 用券提醒</text>
    <text x="310" y="618" class="metric">（2.99 / 5折）</text>

    <rect x="480" y="416" width="190" height="170" rx="26" fill="#ffffff" stroke="#cad2f4" stroke-width="2.5"/>
    <text x="510" y="458" class="card-head">T+7</text>
    <text x="510" y="502" class="card-line">首单后 0-7 天</text>
    <text x="510" y="542" class="card-line">累计未达 2 单</text>
    <text x="510" y="582" class="card-line">T+8 用券提醒</text>
    <text x="520" y="618" class="metric">（2.99 / 5折）</text>

    <rect x="690" y="416" width="220" height="170" rx="26" fill="#ffffff" stroke="#cad2f4" stroke-width="2.5"/>
    <text x="720" y="458" class="card-head">T+14</text>
    <text x="720" y="502" class="card-line">首单后 1-14 天</text>
    <text x="720" y="542" class="card-line">未下 2 单</text>
    <text x="720" y="582" class="card-line">T+15 用券提醒</text>
    <text x="735" y="618" class="metric">（2.99 / 5折）</text>

    <rect x="950" y="416" width="220" height="170" rx="26" fill="#ffffff" stroke="#cad2f4" stroke-width="2.5"/>
    <text x="980" y="458" class="card-head">T+30</text>
    <text x="980" y="502" class="card-line">首单后 1-30 天</text>
    <text x="980" y="542" class="card-line">未下 2 单</text>
    <text x="980" y="582" class="card-line">T+31 用券提醒</text>
    <text x="995" y="618" class="metric">（2.99 / 5折）</text>

    <rect x="1210" y="416" width="220" height="170" rx="26" fill="#ffffff" stroke="#cad2f4" stroke-width="2.5"/>
    <text x="1240" y="458" class="card-head">T+60</text>
    <text x="1240" y="502" class="card-line">首单后 1-60 天</text>
    <text x="1240" y="542" class="card-line">仍未达 2 单</text>
    <text x="1240" y="582" class="card-line">持续观察主链路</text>
  </g>

  <rect x="70" y="670" width="140" height="200" rx="28" fill="#e28a38"/>
  <text x="140" y="734" class="stage-title">2→3单</text>
  <text x="140" y="786" class="stage-sub" fill="#fff0df">承接三单</text>
  <text x="140" y="828" class="stage-sub" fill="#fff0df">券面：6折</text>

  <g class="f">
    <rect x="270" y="672" width="190" height="170" rx="26" fill="#ffffff" stroke="#f0c28e" stroke-width="2.5"/>
    <text x="300" y="714" class="card-head">T+3</text>
    <text x="300" y="758" class="card-line">二单后 1-3 天</text>
    <text x="300" y="798" class="card-line">未下 3 单</text>
    <text x="300" y="838" class="card-line">T+4 用券提醒</text>
    <text x="330" y="874" class="metric">（6折）</text>

    <rect x="480" y="672" width="190" height="170" rx="26" fill="#ffffff" stroke="#f0c28e" stroke-width="2.5"/>
    <text x="510" y="714" class="card-head">T+7</text>
    <text x="510" y="758" class="card-line">二单后 0-7 天</text>
    <text x="510" y="798" class="card-line">累计未达 3 单</text>
    <text x="510" y="838" class="card-line">T+8 用券提醒</text>
    <text x="540" y="874" class="metric">（6折）</text>

    <rect x="690" y="672" width="220" height="170" rx="26" fill="#ffffff" stroke="#f0c28e" stroke-width="2.5"/>
    <text x="720" y="714" class="card-head">T+14</text>
    <text x="720" y="758" class="card-line">二单后 1-14 天</text>
    <text x="720" y="798" class="card-line">未下 3 单</text>
    <text x="720" y="838" class="card-line">T+15 用券提醒</text>
    <text x="755" y="874" class="metric">（6折）</text>

    <rect x="950" y="672" width="220" height="170" rx="26" fill="#ffffff" stroke="#f0c28e" stroke-width="2.5"/>
    <text x="980" y="714" class="card-head">T+30</text>
    <text x="980" y="758" class="card-line">二单后 1-30 天</text>
    <text x="980" y="798" class="card-line">未下 3 单</text>
    <text x="980" y="838" class="card-line">T+31 用券提醒</text>
    <text x="1015" y="874" class="metric">（6折）</text>

    <rect x="1210" y="672" width="220" height="170" rx="26" fill="#ffffff" stroke="#f0c28e" stroke-width="2.5"/>
    <text x="1240" y="714" class="card-head">T+60</text>
    <text x="1240" y="758" class="card-line">首单后 T+60</text>
    <text x="1240" y="798" class="card-line">仍未达 3 单</text>
    <text x="1240" y="838" class="card-line">结束主链路观察</text>
  </g>

  <rect x="70" y="902" width="1410" height="38" rx="18" fill="#eef2ff" stroke="#cad2f4" stroke-width="1.5"/>
  <text x="104" y="928" class="f metric">评估口径：D7首单转化率 ｜ D7二单率 ｜ D30三单率 ｜ D30留存率 ｜ T+60留存率</text>
</svg>
