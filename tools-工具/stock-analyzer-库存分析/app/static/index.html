<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票 PE 分位值分析系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 1.1em;
        }

        .search-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .search-box input::placeholder {
            color: #666;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .btn-success {
            background: linear-gradient(90deg, #00c853, #009624);
            color: #fff;
        }

        .btn-warning {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            color: #fff;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .filter-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #00d4ff;
        }

        .filter-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            color: #888;
            white-space: nowrap;
        }

        .filter-group input, .filter-group select {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
            width: 100px;
        }

        .filter-group select {
            width: 150px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-card .label {
            color: #888;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,212,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .table-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(0,0,0,0.3);
            color: #00d4ff;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        th:hover {
            background: rgba(0,212,255,0.1);
        }

        th.sorted-asc::after {
            content: ' ↑';
        }

        th.sorted-desc::after {
            content: ' ↓';
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .ticker {
            font-weight: bold;
            color: #00d4ff;
        }

        .company-name {
            color: #888;
            font-size: 0.85em;
        }

        .pe-low {
            color: #00c853;
            font-weight: bold;
        }

        .pe-medium {
            color: #ff9800;
        }

        .pe-high {
            color: #f44336;
            font-weight: bold;
        }

        .percentile-bar {
            width: 100px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        .percentile-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .sector-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            background: rgba(123,44,191,0.3);
            color: #c792ea;
            font-size: 0.8em;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .search-section {
                flex-direction: column;
            }

            .quick-actions {
                justify-content: center;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.85em;
            }

            .percentile-bar {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>股票 PE 分位值分析系统</h1>
            <p>实时获取纳斯达克股票数据，分析估值水平</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入股票代码，如 AAPL、NVDA、PDD..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="searchStock()">查询</button>
            </div>
            <div class="quick-actions">
                <button class="btn btn-success" onclick="loadList('nasdaq100')">纳斯达克100</button>
                <button class="btn btn-warning" onclick="loadList('china_adr')">中概股</button>
                <button class="btn btn-secondary" onclick="clearResults()">清空</button>
            </div>
        </div>

        <div class="filter-section" id="filterSection" style="display: none;">
            <div class="filter-title">筛选条件</div>
            <div class="filter-row">
                <div class="filter-group">
                    <label>PE 范围:</label>
                    <input type="number" id="peMin" placeholder="最小" onchange="applyFilter()">
                    <span>-</span>
                    <input type="number" id="peMax" placeholder="最大" onchange="applyFilter()">
                </div>
                <div class="filter-group">
                    <label>百分位:</label>
                    <input type="number" id="percentileMin" placeholder="最小" onchange="applyFilter()">
                    <span>-</span>
                    <input type="number" id="percentileMax" placeholder="最大" onchange="applyFilter()">
                </div>
                <div class="filter-group">
                    <label>排序:</label>
                    <select id="sortBy" onchange="applyFilter()">
                        <option value="pe_percentile">PE百分位</option>
                        <option value="current_pe">当前PE</option>
                        <option value="current_price">当前股价</option>
                        <option value="market_cap_num">市值</option>
                    </select>
                    <select id="sortOrder" onchange="applyFilter()">
                        <option value="asc">升序</option>
                        <option value="desc">降序</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            </div>
        </div>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-card">
                <div class="value" id="totalCount">0</div>
                <div class="label">股票数量</div>
            </div>
            <div class="stat-card">
                <div class="value" id="lowPeCount">0</div>
                <div class="label">低估值 (&lt;30%)</div>
            </div>
            <div class="stat-card">
                <div class="value" id="highPeCount">0</div>
                <div class="label">高估值 (&gt;70%)</div>
            </div>
            <div class="stat-card">
                <div class="value" id="avgPe">0</div>
                <div class="label">平均PE</div>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>正在获取数据，请稍候...</p>
            <p id="loadingProgress"></p>
        </div>

        <div id="resultsContainer">
            <div class="empty-state">
                <h3>开始分析</h3>
                <p>输入股票代码查询，或点击快捷按钮加载股票列表</p>
            </div>
        </div>

        <footer>
            <p>数据来源: Yahoo Finance | PE分位值 = 低于当前PE的历史天数占比</p>
            <p>百分位越低表示估值越便宜，百分位越高表示估值越贵</p>
        </footer>
    </div>

    <script>
        let allStocks = [];
        let filteredStocks = [];

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchStock();
            }
        }

        async function searchStock() {
            const ticker = document.getElementById('searchInput').value.trim();
            if (!ticker) {
                alert('请输入股票代码');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`/api/stock/${ticker}`);
                const data = await response.json();

                if (data.success) {
                    allStocks = [data.data];
                    filteredStocks = allStocks;
                    renderTable();
                    updateStats();
                } else {
                    alert(data.error);
                    hideLoading();
                }
            } catch (error) {
                alert('查询失败: ' + error.message);
                hideLoading();
            }
        }

        async function loadList(listName) {
            showLoading();
            document.getElementById('loadingProgress').textContent = '正在加载股票列表...';

            try {
                const response = await fetch(`/api/list/${listName}`);
                const data = await response.json();

                if (data.success) {
                    allStocks = data.data;
                    filteredStocks = allStocks;
                    renderTable();
                    updateStats();
                    document.getElementById('filterSection').style.display = 'block';
                    document.getElementById('statsBar').style.display = 'flex';
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('加载失败: ' + error.message);
            }

            hideLoading();
        }

        function applyFilter() {
            const peMin = parseFloat(document.getElementById('peMin').value) || null;
            const peMax = parseFloat(document.getElementById('peMax').value) || null;
            const percentileMin = parseFloat(document.getElementById('percentileMin').value) || null;
            const percentileMax = parseFloat(document.getElementById('percentileMax').value) || null;
            const sortBy = document.getElementById('sortBy').value;
            const sortOrder = document.getElementById('sortOrder').value;

            filteredStocks = allStocks.filter(stock => {
                if (peMin !== null && stock.current_pe < peMin) return false;
                if (peMax !== null && stock.current_pe > peMax) return false;
                if (percentileMin !== null && stock.pe_percentile < percentileMin) return false;
                if (percentileMax !== null && stock.pe_percentile > percentileMax) return false;
                return true;
            });

            filteredStocks.sort((a, b) => {
                const aVal = a[sortBy] || 0;
                const bVal = b[sortBy] || 0;
                return sortOrder === 'asc' ? aVal - bVal : bVal - aVal;
            });

            renderTable();
            updateStats();
        }

        function resetFilter() {
            document.getElementById('peMin').value = '';
            document.getElementById('peMax').value = '';
            document.getElementById('percentileMin').value = '';
            document.getElementById('percentileMax').value = '';
            document.getElementById('sortBy').value = 'pe_percentile';
            document.getElementById('sortOrder').value = 'asc';

            filteredStocks = [...allStocks];
            filteredStocks.sort((a, b) => a.pe_percentile - b.pe_percentile);
            renderTable();
            updateStats();
        }

        function clearResults() {
            allStocks = [];
            filteredStocks = [];
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <h3>开始分析</h3>
                    <p>输入股票代码查询，或点击快捷按钮加载股票列表</p>
                </div>
            `;
            document.getElementById('filterSection').style.display = 'none';
            document.getElementById('statsBar').style.display = 'none';
            document.getElementById('searchInput').value = '';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function updateStats() {
            const total = filteredStocks.length;
            const lowPe = filteredStocks.filter(s => s.pe_percentile < 30).length;
            const highPe = filteredStocks.filter(s => s.pe_percentile > 70).length;
            const avgPe = total > 0 ? (filteredStocks.reduce((sum, s) => sum + s.current_pe, 0) / total).toFixed(1) : 0;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('lowPeCount').textContent = lowPe;
            document.getElementById('highPeCount').textContent = highPe;
            document.getElementById('avgPe').textContent = avgPe;
        }

        function getPercentileColor(percentile) {
            if (percentile < 30) return '#00c853';
            if (percentile > 70) return '#f44336';
            return '#ff9800';
        }

        function getPercentileClass(percentile) {
            if (percentile < 30) return 'pe-low';
            if (percentile > 70) return 'pe-high';
            return 'pe-medium';
        }

        function renderTable() {
            hideLoading();

            if (filteredStocks.length === 0) {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="empty-state">
                        <h3>没有找到数据</h3>
                        <p>请尝试其他筛选条件</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th onclick="sortTable('ticker')">股票代码</th>
                                <th onclick="sortTable('current_price')">当前股价</th>
                                <th onclick="sortTable('current_pe')">当前PE</th>
                                <th onclick="sortTable('pe_percentile')">PE百分位</th>
                                <th>3年PE区间</th>
                                <th onclick="sortTable('pb_ratio')">PB</th>
                                <th onclick="sortTable('market_cap_num')">市值</th>
                                <th>行业</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const stock of filteredStocks) {
                const percentileColor = getPercentileColor(stock.pe_percentile);
                const percentileClass = getPercentileClass(stock.pe_percentile);
                const displayName = stock.company_name_cn || stock.company_name;

                html += `
                    <tr>
                        <td>
                            <span class="ticker">${stock.ticker}</span>
                            <div class="company-name">${displayName.substring(0, 20)}</div>
                        </td>
                        <td>$${stock.current_price}</td>
                        <td class="${percentileClass}">${stock.current_pe}</td>
                        <td>
                            <div class="percentile-bar">
                                <div class="percentile-fill" style="width: ${stock.pe_percentile}%; background: ${percentileColor};"></div>
                            </div>
                            <span class="${percentileClass}">${stock.pe_percentile}%</span>
                        </td>
                        <td>${stock.pe_min_3y} - ${stock.pe_max_3y}</td>
                        <td>${stock.pb_ratio || '-'}</td>
                        <td>${stock.market_cap}</td>
                        <td><span class="sector-tag">${stock.sector || 'N/A'}</span></td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('resultsContainer').innerHTML = html;
        }

        function sortTable(field) {
            const currentSort = document.getElementById('sortBy').value;
            const currentOrder = document.getElementById('sortOrder').value;

            if (currentSort === field) {
                document.getElementById('sortOrder').value = currentOrder === 'asc' ? 'desc' : 'asc';
            } else {
                document.getElementById('sortBy').value = field;
                document.getElementById('sortOrder').value = 'asc';
            }

            applyFilter();
        }
    </script>
</body>
</html>
